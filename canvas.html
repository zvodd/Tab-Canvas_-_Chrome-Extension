<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Canvas</title>
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <header id="toolbar">
    <h1>Tab Canvas</h1>
    <div class="toolbar-group">
      <button id="refresh" title="Re-snapshot tabs">Refresh</button>
      <button id="select-all">Select all</button>
      <button id="clear-selection">Clear selection</button>
      <button id="close-selected" class="danger" title="Close all selected tabs">Close selected</button>
      <button id="merge-selected" title="Move all selected tabs into one new window">Merge selected</button>
      <button id="stash-selected" title="Move all selected tabs into the stash window">Stash selected</button>
      <span id="selection-count" class="muted"></span>
    </div>
    <div class="toolbar-group">
      <button id="export-json" title="Export tab data (for an LLM to produce a remap)">Export JSON</button>
      <button id="toggle-json">JSON panel</button>
    </div>
  </header>

  <aside id="json-panel" class="hidden">
    <div class="panel-header">
      <strong>Remap JSON</strong>
      <span class="muted">List of { tabId, windowId }. Use a string key like "new:work" for a new window.</span>
    </div>
    <textarea id="json-editor" spellcheck="false" placeholder='[
  { "tabId": 123, "title": "Example", "windowId": 456 },
  { "tabId": 124, "title": "Other",   "windowId": "new:research" }
]'></textarea>
    <div class="panel-actions">
      <button id="apply-remap" class="primary">Apply remap</button>
      <button id="copy-json">Copy</button>
      <span id="json-status" class="muted"></span>
    </div>
  </aside>

  <main id="workspace">
    <div id="canvas" aria-label="Window groups">
      <div id="lasso" class="hidden"></div>
    </div>
    <aside id="side-panel" aria-label="Stash and trash">
      <section class="side-section stash-section">
        <header>Stash <span id="stash-count" class="count"></span></header>
        <div id="stash-list" class="side-list"></div>
      </section>
      <section class="side-section trash-section">
        <header>Trash <span id="trash-count" class="count"></span></header>
        <div id="trash-list" class="side-list"></div>
      </section>
    </aside>
  </main>

  <script src="lib/tabmap-api.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
